<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finalizar pedido — Arca Sobrevivente</title><meta name="robots" content="noindex"><style>
:root{--bg:#0d0d0d;--card:#171717;--txt:#f2efe8;--mut:#a9a39a;--ouro:#e0b24a;--verm:#d63b2f;--ok:#3cb371}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:0 16px}header{padding:14px 0;border-bottom:1px solid #262626}
header .w{display:flex;align-items:center;justify-content:space-between}.marca{font-weight:800;letter-spacing:.5px;color:var(--ouro)}
.hero{padding:34px 0 10px}.hero h1{font-size:clamp(26px,5vw,42px);line-height:1.15;margin:0 0 14px}
.alerta{display:inline-block;background:var(--verm);color:#fff;font-weight:800;font-size:13px;padding:5px 10px;border-radius:4px;margin-bottom:14px;letter-spacing:.4px}
.hero p{color:var(--mut);font-size:18px;max-width:720px}
.livro{display:grid;grid-template-columns:1fr 1.15fr;gap:28px;background:var(--card);border-radius:14px;padding:22px;margin:26px 0}
@media(max-width:720px){.livro{grid-template-columns:1fr}}
.livro img{width:100%;border-radius:10px;display:block}.livro h2{margin:0 0 4px;font-size:28px}.sub{color:var(--mut);margin:0 0 12px}
.livro ul{padding-left:18px;margin:0 0 16px}.livro li{margin:6px 0}
.opcoes{display:grid;gap:10px;margin:14px 0}.op{border:2px solid #333;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.op.on{border-color:var(--ouro);background:#1f1b12}.op b{font-size:20px}.op small{display:block;color:var(--mut)}
.btn{display:block;width:100%;text-align:center;background:var(--ouro);color:#111;font-weight:800;font-size:18px;padding:15px;border:0;border-radius:10px;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}.mini{color:var(--mut);font-size:13px;margin-top:8px;text-align:center}
.ck{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;padding:26px 0}@media(max-width:720px){.ck{grid-template-columns:1fr}.ck .res{order:-1}}
.ck form,.ck .res{background:var(--card);border-radius:14px;padding:20px}label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#0f0f0f;color:var(--txt);font-size:16px}
.linha{display:flex;justify-content:space-between;margin:8px 0}.tot{font-size:22px;font-weight:800;border-top:1px solid #333;padding-top:10px}
.aviso{background:#1f1b12;border:1px solid var(--ouro);border-radius:10px;padding:14px;margin-top:14px;display:none}
footer{color:#6d6862;font-size:12px;padding:30px 0;text-align:center}
</style><script>!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init','2403134820103341');fbq('track','PageView');
window.SITE='portugal-br';</script></head><body>
<header><div class="w"><span class="marca">ARCA SOBREVIVENTE</span><small style="color:#a9a39a">🔒 Finalizar pedido</small></div></header>
<main class="w"><div class="ck"><form id="f" autocomplete="on">
<label>Nome completo</label><input name="nome" required autocomplete="name"><label>E-mail</label><input name="email" type="email" required autocomplete="email">
<label>WhatsApp (opcional)</label><input name="telefone" autocomplete="tel">
<div id="end"><label>Endereço completo</label><input name="endereco" autocomplete="street-address"><label>Cidade</label><input name="cidade" autocomplete="address-level2">
<label>Estado / província</label><input name="estado" autocomplete="address-level1"><label>Código postal</label><input name="cep" autocomplete="postal-code"></div>
<p></p><button class="btn" type="submit">Ir para o pagamento seguro</button><p class="mini">Pagamento seguro por cartão, Apple Pay ou Google Pay<br>7 dias de garantia: não gostou, devolvemos seu dinheiro.</p>
<div class="aviso" id="aviso"></div></form>
<div class="res"><h3 style="margin-top:0">Seu pedido</h3><div id="item"></div><div class="linha tot"><span>Total</span><span id="tot"></span></div></div></div></main>
<footer>© Arca Sobrevivente · Capital Ramos Reis LTDA</footer>
<script>
var D={"moeda": "EUR", "precos": {"manual": {"ebook": 11.9, "fisico": 55.0}, "qtp": {"ebook": 8.9, "fisico": 32.0}}, "nomes": {"qtp": "Quando Tudo Para", "manual": "Manual de Sobrevivência"}, "formatos": {"ebook": "E-book (PDF)", "fisico": "Livro físico"}, "links": {"qtp/fisico": "https://buy.stripe.com/3cI5kweiNbyU61g9srf3a04", "qtp/ebook": "https://buy.stripe.com/4gMeV6eiN32o0GW0VVf3a05", "manual/fisico": "https://buy.stripe.com/dRm00c5Mh8mI2P4487f3a06", "manual/ebook": "https://buy.stripe.com/eVq5kw1w146s4Xc7kjf3a07"}, "pais": "Portugal", "aguarde": "Estamos ativando o pagamento na sua moeda. Seu pedido foi guardado e vamos te enviar o link de pagamento por e-mail em até 24 horas.", "webhook": "https://n8nwebhook.engenhariajg.com/webhook/pedido-global", "fmt": ["€ ", 2, ",", "."]};var q=new URLSearchParams(location.search);
var livro=q.get('livro')||Object.keys(D.nomes)[0],formato=q.get('formato')||'ebook';if(!D.precos[livro])livro=Object.keys(D.nomes)[0];
var v=D.precos[livro][formato];function fm(x){var c=D.fmt[1];var s=x.toFixed(c).replace(/\B(?=(\d{3})+(?!\d))/g,'§');s=s.replace('.',D.fmt[2]).replace(/§/g,D.fmt[3]);return D.fmt[0]+s}
document.getElementById('item').innerHTML='<div class="linha"><span>'+D.nomes[livro]+'<br><small style="color:#a9a39a">'+D.formatos[formato]+'</small></span><span>'+fm(v)+'</span></div>';
document.getElementById('tot').textContent=fm(v);
var end=document.getElementById('end');if(formato!=='fisico'){end.style.display='none'}else{end.querySelectorAll('input').forEach(function(i){i.required=true})}
fbq('track','InitiateCheckout',{content_category:SITE,content_ids:[livro+'_'+formato],value:v,currency:D.moeda});
document.getElementById('f').onsubmit=function(e){e.preventDefault();var fd=Object.fromEntries(new FormData(this).entries());
  var ped={site:SITE,livro:livro,formato:formato,valor:v,moeda:D.moeda,pais:D.pais,cliente:fd,utm:location.search,quando:new Date().toISOString()};
  fbq('track','AddPaymentInfo',{content_category:SITE,value:v,currency:D.moeda});
  try{fetch(D.webhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ped),keepalive:true})}catch(x){}
  var link=D.links[livro+'/'+formato];
  if(link){location.href=link+(link.indexOf('?')<0?'?':'&')+'prefilled_email='+encodeURIComponent(fd.email)+'&client_reference_id='+SITE+'-'+livro+'-'+formato;}
  else{var a=document.getElementById('aviso');a.textContent=D.aguarde;a.style.display='block';this.querySelector('button').disabled=true;}
};
</script></body></html>
